name: Friend Circle Lite

on:
  schedule:
    - cron: "22 */4 * * *"
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  PAGE_BRANCH: page
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  friend-circle-lite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Pull Latest Repository
      uses: actions/checkout@v4

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Ensure temp folder is not empty
      run: |
        mkdir -p ./temp
        echo "placeholder" > ./temp/.keep

    - name: Download temp file artifact
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        branch: main
        name: 'temp'
        path: './temp'
        if_no_artifact_found: warn

    - name: Sync friend list from blog
      continue-on-error: true  # 博客接口挂了就退回用仓库里的快照，不阻断爬取
      run: |
        python3 - <<'EOF'
        import json, urllib.request

        # 每次爬取前从博客后端拉最新友链（分组+links → FCL 的 friends 数组），
        # 博客上友链增删最多 4 小时后自动进朋友圈，不再需要手动导出
        BLOCK = ("nextjs.org", "react.dev", "nodejs.org", "blog.yaria.top")
        req = urllib.request.Request(
            "https://blognext-end.yaria.top/get/flink/flinks",
            headers={"User-Agent": "Friend-Circle-Lite-sync"},
        )
        data = json.load(urllib.request.urlopen(req, timeout=30))
        friends, seen = [], set()
        for g in data.get("data", []):
            for l in g.get("links", []):
                link = (l.get("url") or "").strip().rstrip("/")
                dom = link.split("//")[-1].split("/")[0].lower()
                # 文档站（开发基础组）和本站自身不参与朋友圈抓取
                if any(dom == b or dom.endswith("." + b) for b in BLOCK):
                    continue
                if link and link not in seen:
                    seen.add(link)
                    friends.append(
                        {"name": l.get("name", ""), "link": link, "avatar": l.get("avatar", "")}
                    )
        json.dump({"friends": friends}, open("friend.json", "w", encoding="utf-8"),
                  ensure_ascii=False, indent=1)
        print(f"synced {len(friends)} friends")
        EOF
        if ! git diff --quiet friend.json; then
          git add friend.json
          git commit -m "sync: 博客友链快照 $(date +'%m-%d %H:%M')"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
        else
          echo "friend.json 无变化，跳过提交"
        fi

    - name: Check RSS feeds
      env:
        SMTP_PWD: ${{ secrets.SMTP_PWD }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
        FCL_REPO: ${{ github.repository }}
        FCL_CONFIG_OVERRIDES: ${{ vars.FCL_CONFIG_OVERRIDES }}
      run: |
        echo "Checking RSS feeds..."
        python run.py
        ls ./temp
    
    - name: Upload temp file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: 'temp'
        path: './temp'
        retention-days: 30

    - name: git config
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Build static publish directory
      run: |
        mkdir pages
        cp -r main ./static/edgeone.json ./static/_headers ./static/index.html ./static/readme.md ./static/favicon.ico ./static/bg-light.webp ./static/bg-dark.webp all.json link.json errors.json pages/
        # 兼容层：旧友圈 API（/all /post /randompost /version 等）的 serverless 函数
        # 与重写规则，随静态数据一起发布；version.txt 供 /version 接口读取
        cp -r ./compat/api ./compat/vercel.json pages/
        grep -m1 -oP '(?<=## \[)[0-9.]+' CHANGELOG.md > pages/version.txt || echo "2.1.0" > pages/version.txt

    - name: Publish static assets to branches
      run: |
        published_tree=""
        if git fetch origin "${PAGE_BRANCH}:refs/remotes/origin/${PAGE_BRANCH}"; then
          published_tree=$(git rev-parse "origin/${PAGE_BRANCH}^{tree}")
        fi
        cd pages
        git init
        git add .
        generated_tree=$(git write-tree)
        if [ -n "$published_tree" ] && [ "$generated_tree" = "$published_tree" ]; then
          echo "No static asset changes; skipping page branch update."
          exit 0
        fi
        git commit -m "⏱️ $(date +"%Y年%m月%d日-%H时%M分") GitHub Actions定时更新"
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ env.PAGE_BRANCH }}

    - name: Point domain at new deployment
      continue-on-error: true  # 别名失败不影响数据发布，下次爬取会重试
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      run: |
        TEAM="team_YvQSgqL6B9P5I4AqSeCJVTRz"
        PROJ="friend-circle-lite"
        # Vercel API 不支持把生产分支设为 page（只能用仓库默认分支 main），
        # page 推送只会生成 preview 部署；这里等最新构建 READY 后把域名指过去
        sleep 20
        DID=""
        for i in $(seq 1 30); do
          OUT=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?teamId=$TEAM&project=$PROJ&limit=1") || { sleep 5; continue; }
          OUT=$(echo "$OUT" | python3 -c "import json,sys; d=json.load(sys.stdin)['deployments'][0]; print(d['uid'] if d['state']=='READY' else '')")
          if [ -n "$OUT" ]; then DID="$OUT"; break; fi
          sleep 5
        done
        if [ -n "$DID" ]; then
          curl -sf -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v2/deployments/$DID/aliases?teamId=$TEAM" \
            -d '{"alias":"fcircle.yaria.top"}' >/dev/null && echo "fcircle.yaria.top -> $DID"
        else
          echo "等待部署超时，域名保持上一次指向"
        fi

    - name: Delete Workflow Runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 30
        keep_minimum_runs: 6

  keepalive-workflow:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: friend-circle-lite
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
        with:
          GITHUB_TOKEN: ${{ github.token }}
        env:
          GH_TOKEN: ${{ github.token }}
