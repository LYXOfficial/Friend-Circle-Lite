# Ariasaka 的友圈配置（从旧 hexo-circle-of-friends 迁移）
# 旧部署用 LeanCloud 存数据，已停服；本版数据落在 SQLite（Action artifact 持久化）。

debug: false

spider_settings:
  enable: true
  # 友链列表快照：从博客后端 /get/flink/flinks 导出（groups+links → friends 数组）。
  # 博客上友链有增删后，需要重新导出并覆盖仓库根目录的 friend.json。
  json_url: "https://raw.githubusercontent.com/LYXOfficial/Friend-Circle-Lite/main/friend.json"
  article_count: 5

proxy_settings:
  # GH Actions 美国出口直连即可，不需要代理
  proxy_url: ""

merge_settings:
  enable: false
  remote_base_url: ""
  merge_article_data: true
  merge_link_check_data: true

link_check:
  max_age_hours: 24
  timeout: 15
  max_workers: 10
  status_api_url: "https://v2.xxapi.cn/api/status?url={url}"
  # 旧部署靠爬自己的友链页发现友链，没有反链检测；关掉省一轮对每个友链页的请求
  enable_backlink_check: false
  author_url: "blog.yaria.top"

# 邮件功能不开（没配 SMTP 密钥），避免 Action 因缺 SMTP_PWD 报错
email_push:
  enable: false
  to_email: ""
  subject: ""
  body_template: ""

rss_subscribe:
  enable: false
  github_username: LYXOfficial
  github_repo: Friend-Circle-Lite
  your_blog_url: "https://blog.yaria.top/"
  email_template: "./push_templates/default.html"
  website_info:
    title: ""

smtp:
  email: ""
  server: ""
  port: 465
  use_tls: true

# 特殊 RSS 后缀（旧配置没有自定义项，保持空数组）
specific_RSS: []
